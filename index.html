<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title translate="no">MWISENEZA Janvier | Portfolio</title>
<meta name="description" content="MWISENEZA Janvier — Umunyeshuri muri TTC Muhanga, utuye mu Karere ka Kamonyi, mu Rwanda.">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040814;--navy:#0b1633;--blue:#3a74ff;--sky:#7fa6ff;--gold:#f5c04a;--gold2:#ffdf8f;--tx:#e9eefb;--mut:#93a0bf;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse 80% 50% at 15% 0%,#102259 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 100% 60%,#1a1535 0%,transparent 70%),var(--bg);color:var(--tx);font-family:Manrope,system-ui,"Segoe UI",sans-serif;line-height:1.65;overflow-x:hidden}
h1,h2,h3{font-family:Syne,system-ui,sans-serif;line-height:1.15}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Navigation */
nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 5vw;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(4,8,20,.72);border-bottom:1px solid var(--line)}
nav b{font-family:Syne,sans-serif;color:var(--gold);font-size:1.05rem;white-space:nowrap}
.links{display:flex;gap:clamp(12px,2.5vw,26px);font-size:.92rem}
nav a{text-decoration:none;color:var(--mut);transition:color .2s}
nav a:hover{color:var(--gold2)}
.nr{display:flex;align-items:center;gap:10px}

/* Compact Language Switcher */
.lb{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.ll{font-size:.75rem;font-weight:600;color:var(--mut);white-space:nowrap}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;color:var(--mut);font:700 .74rem Manrope,sans-serif;padding:3px 7px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.lang button[aria-pressed=true]{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1203;box-shadow:0 0 12px rgba(245,192,74,.4)}

/* Hero Section */
.hero{min-height:90vh;display:flex;align-items:center;padding:40px 5vw}
.hero .in{max-width:620px}
.me{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.ph{position:relative;width:128px;height:128px;flex:none;border-radius:50%;box-shadow:0 0 34px rgba(245,192,74,.45),0 0 70px rgba(58,116,255,.35)}
.ph::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--gold),var(--blue),var(--gold2),var(--blue),var(--gold));animation:spin 7s linear infinite}
.ph img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:50%;object-fit:cover;background:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.loc{color:var(--tx);font-size:.96rem;max-width:34ch;background:var(--glass);border:1px solid var(--line);padding:10px 16px;border-radius:16px}
.hero p.hi{color:var(--sky);font-weight:600;margin-bottom:8px}
.hero h1{font-size:clamp(2.1rem,3.8vw,3.3rem);font-weight:800;padding-right:.1em;background:linear-gradient(100deg,var(--gold2),var(--gold) 55%,#e39b1d);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
.hero h2{font-size:clamp(1.1rem,2.6vw,1.45rem);font-weight:600;color:var(--tx);margin-bottom:14px}
.hero p.d{color:var(--mut);max-width:50ch;margin-bottom:28px}
.btn{display:inline-block;border:0;cursor:pointer;font:600 .95rem Manrope,sans-serif;padding:12px 24px;border-radius:999px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn.g{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1203;box-shadow:0 0 24px rgba(245,192,74,.35)}
.btn.o{border:1px solid var(--line);background:var(--glass);margin-left:10px;color:var(--tx)}
.btn:hover{transform:translateY(-2px)}
#authBtn{padding:7px 16px;font-size:.85rem}

/* Sections & Cards */
section{padding:80px 5vw 20px;max-width:1180px;margin:auto}
section>h2{font-size:clamp(1.75rem,4.5vw,2.6rem);margin-bottom:8px}
section>p.s{color:var(--mut);margin-bottom:32px;max-width:54ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;perspective:1000px}
.card{--mx:50%;--my:50%;position:relative;padding:26px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .2s,border-color .3s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle 180px at var(--mx) var(--my),rgba(245,192,74,.2),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{border-color:rgba(245,192,74,.55);transform:translateY(-4px)}
.card:hover::before{opacity:1}
.card h3{font-size:1.05rem;line-height:1.4;overflow-wrap:break-word;margin-bottom:10px;color:var(--gold2)}
.card p{color:var(--mut);font-size:.93rem}
.sk{cursor:pointer}
.card .more{margin-top:14px;color:var(--gold);font-size:.84rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}

/* Custom Glowing SVG Icon Box */
.ib{width:62px;height:62px;border-radius:16px;background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.4);display:grid;place-items:center;margin-bottom:16px;color:var(--gold2);box-shadow:0 0 20px rgba(245,192,74,.25),inset 0 0 12px rgba(245,192,74,.1)}
.ib svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(245,192,74,.7))}

/* Contact Form */
form{max-width:640px;padding:28px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px)}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
input,textarea{width:100%;padding:12px 14px;margin-bottom:16px;border-radius:12px;border:1px solid var(--line);background:rgba(4,8,20,.68);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,192,74,.18)}
textarea{min-height:120px;resize:vertical}
#st{margin-top:12px;font-weight:600;min-height:1.4em}
#st.ok{color:#6ee7a8}#st.er{color:#ff8a8a}

/* Lock gate only for Contact Form */
.lw{position:relative;max-width:640px}
body:not(.authed) .lk{filter:blur(8px);user-select:none;pointer-events:none}
.gate{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
body:not(.authed) .gate{display:flex}
.gate div{padding:22px;border-radius:20px;background:rgba(4,8,20,.82);border:1px solid var(--line);backdrop-filter:blur(8px)}
.gate p{margin-bottom:12px;color:var(--mut)}

/* Dialog Modals */
dialog{margin:auto;width:min(92vw,420px);padding:26px;border-radius:22px;border:1px solid var(--line);background:rgba(11,22,51,.97);color:var(--tx);box-shadow:0 0 70px rgba(58,116,255,.35)}
dialog::backdrop{background:rgba(2,5,14,.75);backdrop-filter:blur(4px)}
dialog h3{font-size:1.4rem;margin-bottom:14px;color:var(--gold2)}
#af{max-width:none;padding:0;border:0;background:none;backdrop-filter:none}
.gb{width:100%;margin-bottom:14px;background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:11px;font:600 .95rem Manrope,sans-serif;cursor:pointer}
.lnk{background:none;border:0;color:var(--gold2);cursor:pointer;font:inherit;text-decoration:underline;margin-top:10px}
#ae{color:#ff8a8a;font-weight:600;min-height:1.4em;margin-top:8px}
#sdp{color:var(--tx);line-height:1.7;margin:10px 0 20px;font-size:.96rem}

/* Social & Footer */
.soc{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.soc a{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);color:var(--gold2);transition:transform .2s,border-color .2s}
.soc a:hover{transform:translateY(-3px);border-color:var(--gold)}
.soc svg{width:24px;height:24px}
footer{text-align:center;color:var(--mut);padding:60px 5vw 40px;font-size:.9rem;border-top:1px solid var(--line);margin-top:60px}

@media(max-width:720px){
  .links{display:none}
  .btn.o{margin:10px 0 0}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<nav>
  <b translate="no" class="notranslate">MWISENEZA Janvier</b>
  <div class="links">
    <a href="#ahabanza" data-i18n="nav_home">Ahabanza</a>
    <a href="#ubumenyi" data-i18n="nav_skills">Ubumenyi</a>
    <a href="#imishinga" data-i18n="nav_projects">Imishinga</a>
    <a href="#andika" data-i18n="nav_contact">Nyandikire</a>
  </div>
  <div class="nr">
    <div class="lb notranslate" translate="no" title="Hindura ururimi / Change language">
      <span class="ll">🌐 Ururimi:</span>
      <div class="lang">
        <button type="button" data-lang="rw" aria-pressed="true">RW</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
    <button id="authBtn" class="btn g" type="button" data-i18n="btn_signin">Injira</button>
  </div>
</nav>

<header id="ahabanza" class="hero">
  <div class="in">
    <div class="me">
      <div class="ph">
        <img src="https://postimg.cc" alt="Ifoto ya MWISENEZA Janvier">
